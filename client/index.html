<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusDash - AI Data Intelligence Platform</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background-color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
          <div style="width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:nexus-spin 0.7s linear infinite;"></div>
          <span style="color:#64748b;font-size:13px;font-weight:500;letter-spacing:-0.01em;">Loading NexusDash...</span>
        </div>
        <style>@keyframes nexus-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
